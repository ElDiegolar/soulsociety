<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f1115"/>
  <text x="80" y="160" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="#e8e6e1">soul<tspan fill="#5fc3a9">society</tspan></text>
  <text x="80" y="230" font-family="system-ui, sans-serif" font-size="34" fill="#9aa0aa">Zero-knowledge souls for AI harnesses</text>
  <g transform="translate(80 300)" font-family="system-ui, sans-serif" font-size="26" fill="#e8e6e1">
    <g><circle cx="20" cy="0" r="20" fill="#5fc3a9"/><text x="60" y="9">Brief → Read → Learn → Gate → Witness → Sync → Grow</text></g>
    <text x="0" y="70" fill="#9aa0aa">The host stores ciphertext only. The soul's own trust ladder gates every write.</text>
    <text x="0" y="120" fill="#9aa0aa">Portable · append-only · deterministic replay · MIT</text>
  </g>
