<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b0d17"/>
  <text x="80" y="160" font-family="Cinzel, Georgia, serif" font-size="72" font-weight="700" fill="#ece4d2">soul<tspan fill="#d4af5a">society</tspan></text>
  <text x="80" y="230" font-family="Cinzel, Georgia, serif" font-size="34" fill="#a89f8a">Zero-knowledge souls for AI harnesses</text>
  <g transform="translate(80 300)" font-family="Cinzel, Georgia, serif" font-size="26" fill="#ece4d2">
    <g><circle cx="20" cy="0" r="20" fill="#d4af5a"/><text x="60" y="9">Brief → Read → Learn → Gate → Witness → Sync → Grow</text></g>
    <text x="0" y="70" fill="#a89f8a">The host stores ciphertext only. The soul's own trust ladder gates every write.</text>
    <text x="0" y="120" fill="#a89f8a">Portable · append-only · deterministic replay · MIT</text>
  </g>
